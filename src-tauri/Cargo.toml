[package]
name = "claude-island"
version = "0.2.0"
description = "Claude Island — виджет лимитов Claude в стиле Dynamic Island"
authors = ["oligarh2050"]
edition = "2021"

[lib]
name = "claude_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_DataExchange",
  "Win32_Globalization",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Security_Cryptography",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_System_Variant",
  "Media_Control",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
